name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'content/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the deployment artifact
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validate committed site
        run: |
          python3 -X utf8 scripts/check_site.py
          node --check dist/app.js
          node --check dist/moments.js
          node --check dist/article.js
          node --check dist/article-search-worker.js
          node --test tests/test_reader_runtime.mjs tests/test_gallery_runtime.mjs
      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
